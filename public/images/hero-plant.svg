<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#103B66" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#087CC1" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="ssMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B0C4DE"/>
      <stop offset="30%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#8FA3BF"/>
      <stop offset="100%" stop-color="#6982A0"/>
    </linearGradient>
    <linearGradient id="frpBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#005B9E"/>
      <stop offset="25%" stop-color="#087CC1"/>
      <stop offset="60%" stop-color="#28C5D7"/>
      <stop offset="100%" stop-color="#003D6B"/>
    </linearGradient>
    <linearGradient id="frpDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="40%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="waterFlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#28C5D7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#087CC1" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#05192d" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Ambient background glow / platform -->
  <ellipse cx="400" cy="520" rx="350" ry="45" fill="#031628" opacity="0.6"/>
  <ellipse cx="400" cy="510" rx="320" ry="35" fill="url(#bgGlow)"/>

  <!-- Main Industrial Skid Frame -->
  <g filter="url(#softShadow)">
    <!-- Base structural beams -->
    <rect x="120" y="470" width="560" height="24" rx="4" fill="url(#ssMetal)"/>
    <rect x="130" y="490" width="20" height="30" rx="2" fill="#475569"/>
    <rect x="300" y="490" width="20" height="30" rx="2" fill="#475569"/>
    <rect x="480" y="490" width="20" height="30" rx="2" fill="#475569"/>
    <rect x="650" y="490" width="20" height="30" rx="2" fill="#475569"/>

    <!-- Vertical support beams -->
    <rect x="150" y="160" width="18" height="310" fill="url(#ssMetal)"/>
    <rect x="390" y="160" width="18" height="310" fill="url(#ssMetal)"/>
    <rect x="630" y="160" width="18" height="310" fill="url(#ssMetal)"/>
    <rect x="150" y="150" width="500" height="18" fill="url(#ssMetal)"/>
    <rect x="150" y="310" width="500" height="14" fill="url(#ssMetal)"/>

    <!-- DUAL FRP COMPOSITE VESSELS (Pre-treatment Media & Carbon Filters) -->
    <!-- FRP Vessel 1 -->
    <g transform="translate(190, 100)">
      <!-- Top dome -->
      <path d="M 10,70 Q 45,25 80,70 Z" fill="url(#frpBlue)"/>
      <!-- Multiport valve -->
      <rect x="35" y="10" width="20" height="25" rx="3" fill="#0F172A"/>
      <path d="M 25,18 L 65,18 L 65,26 L 25,26 Z" fill="#334155"/>
      <circle cx="45" cy="8" r="8" fill="#10B981"/>
      <text x="45" y="11" font-size="6" fill="#FFF" text-anchor="middle" font-weight="bold">AUTO</text>
      <!-- Cylinder body -->
      <rect x="10" y="68" width="70" height="290" fill="url(#frpBlue)"/>
      <!-- Bottom base stand -->
      <path d="M 5,355 L 85,355 L 75,375 L 15,375 Z" fill="url(#frpDark)"/>
      <!-- Highlights and label -->
      <rect x="25" y="180" width="40" height="40" rx="3" fill="#FFFFFF" opacity="0.9"/>
      <text x="45" y="196" font-family="sans-serif" font-size="7" font-weight="bold" fill="#087CC1" text-anchor="middle">PENTAIR</text>
      <text x="45" y="208" font-family="sans-serif" font-size="6" fill="#334155" text-anchor="middle">FRP VESSEL</text>
      <line x1="24" y1="70" x2="24" y2="355" stroke="#FFF" stroke-width="3" opacity="0.4"/>
    </g>

    <!-- FRP Vessel 2 -->
    <g transform="translate(295, 100)">
      <!-- Top dome -->
      <path d="M 10,70 Q 45,25 80,70 Z" fill="url(#frpBlue)"/>
      <!-- Multiport valve -->
      <rect x="35" y="10" width="20" height="25" rx="3" fill="#0F172A"/>
      <path d="M 25,18 L 65,18 L 65,26 L 25,26 Z" fill="#334155"/>
      <circle cx="45" cy="8" r="8" fill="#10B981"/>
      <!-- Cylinder body -->
      <rect x="10" y="68" width="70" height="290" fill="url(#frpBlue)"/>
      <!-- Bottom base stand -->
      <path d="M 5,355 L 85,355 L 75,375 L 15,375 Z" fill="url(#frpDark)"/>
      <!-- Highlights and label -->
      <rect x="25" y="180" width="40" height="40" rx="3" fill="#FFFFFF" opacity="0.9"/>
      <text x="45" y="196" font-family="sans-serif" font-size="7" font-weight="bold" fill="#103B66" text-anchor="middle">TATA STEEL</text>
      <text x="45" y="208" font-family="sans-serif" font-size="6" fill="#334155" text-anchor="middle">FRP VESSEL</text>
      <line x1="24" y1="70" x2="24" y2="355" stroke="#FFF" stroke-width="3" opacity="0.4"/>
    </g>

    <!-- HORIZONTAL INDUSTRIAL RO MEMBRANE PRESSURE VESSELS -->
    <!-- Membrane 1 (Top) -->
    <g transform="translate(410, 180)">
      <rect x="0" y="0" width="250" height="42" rx="21" fill="url(#ssMetal)"/>
      <!-- End caps and clamps -->
      <rect x="-6" y="2" width="12" height="38" rx="4" fill="#334155"/>
      <rect x="244" y="2" width="12" height="38" rx="4" fill="#334155"/>
      <rect x="40" y="-3" width="10" height="48" fill="#475569"/>
      <rect x="190" y="-3" width="10" height="48" fill="#475569"/>
      <!-- High pressure label -->
      <text x="125" y="26" font-family="monospace" font-size="11" font-weight="bold" fill="#0A2540" text-anchor="middle" letter-spacing="1">RO PRESSURE VESSEL • 4040</text>
      <line x1="20" y1="12" x2="230" y2="12" stroke="#FFF" stroke-width="2" opacity="0.6"/>
    </g>

    <!-- Membrane 2 (Bottom) -->
    <g transform="translate(410, 240)">
      <rect x="0" y="0" width="250" height="42" rx="21" fill="url(#ssMetal)"/>
      <rect x="-6" y="2" width="12" height="38" rx="4" fill="#334155"/>
      <rect x="244" y="2" width="12" height="38" rx="4" fill="#334155"/>
      <rect x="40" y="-3" width="10" height="48" fill="#475569"/>
      <rect x="190" y="-3" width="10" height="48" fill="#475569"/>
      <text x="125" y="26" font-family="monospace" font-size="11" font-weight="bold" fill="#0A2540" text-anchor="middle" letter-spacing="1">HIGH REJECTION TFC MEMBRANE</text>
      <line x1="20" y1="12" x2="230" y2="12" stroke="#FFF" stroke-width="2" opacity="0.6"/>
    </g>

    <!-- MICRON CARTRIDGE FILTER HOUSING -->
    <g transform="translate(415, 310)">
      <path d="M 10,25 Q 25,5 40,25 Z" fill="#0284C7"/>
      <rect x="10" y="25" width="30" height="135" rx="5" fill="#38BDF8" opacity="0.85"/>
      <!-- Internal pleated filter element visible -->
      <rect x="16" y="35" width="18" height="115" rx="3" fill="#F8FAFC"/>
      <line x1="16" y1="50" x2="34" y2="50" stroke="#CBD5E1"/>
      <line x1="16" y1="70" x2="34" y2="70" stroke="#CBD5E1"/>
      <line x1="16" y1="90" x2="34" y2="90" stroke="#CBD5E1"/>
      <line x1="16" y1="110" x2="34" y2="110" stroke="#CBD5E1"/>
      <line x1="16" y1="130" x2="34" y2="130" stroke="#CBD5E1"/>
    </g>

    <!-- VERTICAL MULTISTAGE HIGH-PRESSURE PUMP (CRI / Grundfos type) -->
    <g transform="translate(465, 315)">
      <!-- Electric motor on top -->
      <rect x="12" y="5" width="36" height="45" rx="4" fill="#0284C7"/>
      <path d="M 8,5 L 52,5 L 48,0 L 12,0 Z" fill="#0369A1"/>
      <!-- Pump stages cylinder -->
      <rect x="18" y="50" width="24" height="95" fill="url(#ssMetal)"/>
      <!-- Stage flanges -->
      <line x1="14" y1="65" x2="46" y2="65" stroke="#334155" stroke-width="3"/>
      <line x1="14" y1="85" x2="46" y2="85" stroke="#334155" stroke-width="3"/>
      <line x1="14" y1="105" x2="46" y2="105" stroke="#334155" stroke-width="3"/>
      <line x1="14" y1="125" x2="46" y2="125" stroke="#334155" stroke-width="3"/>
      <!-- Base flange -->
      <rect x="10" y="145" width="40" height="15" rx="2" fill="#1E293B"/>
    </g>

    <!-- AUTOMATION CONTROL PANEL & ROTAMETERS -->
    <g transform="translate(530, 315)">
      <!-- Main Electrical Box -->
      <rect x="0" y="0" width="135" height="155" rx="6" fill="url(#panelGrad)" stroke="#475569" stroke-width="2"/>
      <!-- Header banner -->
      <rect x="6" y="6" width="123" height="24" rx="3" fill="#0A2540"/>
      <circle cx="16" cy="18" r="4" fill="#22C55E"/>
      <text x="26" y="22" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF">GRAVITY AUTO PLC</text>

      <!-- Digital LCD display -->
      <rect x="10" y="36" width="115" height="30" rx="3" fill="#042F2E" stroke="#14B8A6"/>
      <text x="16" y="49" font-family="monospace" font-size="8" fill="#2DD4BF">SYSTEM STATUS: OPTIMAL</text>
      <text x="16" y="60" font-family="monospace" font-size="8" fill="#5EEAD4">TDS: 28 PPM | 500 LPH</text>

      <!-- Analog Pressure Gauges -->
      <circle cx="28" cy="88" r="14" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
      <path d="M 28,88 L 36,80" stroke="#DC2626" stroke-width="2" stroke-linecap="round"/>
      <text x="28" y="108" font-size="6" fill="#94A3B8" text-anchor="middle">FEED (kg/cm²)</text>

      <circle cx="68" cy="88" r="14" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
      <path d="M 68,88 L 76,82" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
      <text x="68" y="108" font-size="6" fill="#94A3B8" text-anchor="middle">RO HIGH P</text>

      <!-- Dual Flow Rotameters (Permeate & Reject) -->
      <rect x="94" y="74" width="12" height="44" rx="3" fill="#E0F2FE" stroke="#0284C7"/>
      <line x1="100" y1="80" x2="100" y2="112" stroke="#0284C7" stroke-width="1.5"/>
      <polygon points="98,95 102,95 100,91" fill="#DC2626"/>
      <text x="100" y="125" font-size="5" fill="#94A3B8" text-anchor="middle">PURE</text>

      <rect x="112" y="74" width="12" height="44" rx="3" fill="#E0F2FE" stroke="#0284C7"/>
      <line x1="118" y1="80" x2="118" y2="112" stroke="#0284C7" stroke-width="1.5"/>
      <polygon points="116,98 120,98 118,94" fill="#0284C7"/>
      <text x="118" y="125" font-size="5" fill="#94A3B8" text-anchor="middle">REJECT</text>

      <!-- Push switches -->
      <circle cx="30" cy="138" r="6" fill="#22C55E"/>
      <circle cx="50" cy="138" r="6" fill="#EF4444"/>
      <circle cx="70" cy="138" r="6" fill="#F59E0B"/>
    </g>

    <!-- CONNECTING PIPING & VALVES (Industrial UPVC / SS) -->
    <path d="M 235,120 L 235,80 L 340,80 L 340,120" stroke="#0284C7" stroke-width="8" fill="none" stroke-linejoin="round"/>
    <path d="M 340,100 L 430,100 L 430,310" stroke="#0284C7" stroke-width="8" fill="none" stroke-linejoin="round"/>
    <path d="M 445,380 L 465,380" stroke="#0284C7" stroke-width="8" fill="none"/>
    <path d="M 480,315 L 480,200 L 410,200" stroke="#38BDF8" stroke-width="6" fill="none" stroke-linejoin="round"/>
    <path d="M 660,200 L 685,200 L 685,260 L 660,260" stroke="#38BDF8" stroke-width="6" fill="none" stroke-linejoin="round"/>
    <!-- Glowing pure water outlet -->
    <path d="M 660,260 L 730,260 L 730,460" stroke="#28C5D7" stroke-width="6" fill="none" stroke-linejoin="round"/>
    <circle cx="730" cy="460" r="7" fill="#28C5D7"/>
  </g>

  <!-- Engineering Spec Tag Overlay -->
  <g transform="translate(620, 70)">
    <rect width="150" height="65" rx="8" fill="#0F172A" opacity="0.9" stroke="#28C5D7" stroke-width="1.5"/>
    <circle cx="20" cy="22" r="6" fill="#10B981"/>
    <text x="32" y="25" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">ENGINEERED IN KERALA</text>
    <text x="20" y="42" font-family="sans-serif" font-size="9" fill="#94A3B8">Serving Since 2018</text>
    <text x="20" y="55" font-family="sans-serif" font-size="9" font-weight="bold" fill="#38BDF8">Pentair &amp; TATA Certified FRP</text>
  </g>
</svg>
